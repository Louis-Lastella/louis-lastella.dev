name: Deploy

# Astro prüft die Typen, baut statisches HTML (Deutsch + /en) und veröffentlicht es über GitHub Pages.
# Danach wird /lebenslauf/ mit Chrome (auf den GitHub-Runnern vorinstalliert) zu /lebenslauf.pdf gedruckt.
# Fehlt das PDF, bricht der Build ab und die alte Version bleibt online.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Montags neu bauen, damit "Aktualisiert <Monat>" bei den Projekten stimmt.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          build-cmd: |
            npm run build
            npx astro preview --port 4329 &
            PREVIEW=$!
            for i in $(seq 30); do curl -sf http://localhost:4329/lebenslauf/ >/dev/null && break; sleep 1; done
            google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=dist/lebenslauf.pdf http://localhost:4329/lebenslauf/
            kill $PREVIEW || true
            test -s dist/lebenslauf.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
